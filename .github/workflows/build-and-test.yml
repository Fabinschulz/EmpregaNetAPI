name: CI - Build and Tests

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string
      tests_project_path:
        required: true
        type: string
      bff_solution_file:
        description: "Solução do BFF. Vazio pula o build do BFF."
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution_file }}

      - name: Build solution
        run: dotnet build ${{ inputs.solution_file }} --configuration Release --no-restore

      - name: Build BFF solution
        if: inputs.bff_solution_file != ''
        run: dotnet build ${{ inputs.bff_solution_file }} --configuration Release

      - name: Run tests
        run: dotnet test ${{ inputs.tests_project_path }} --configuration Release --verbosity normal
