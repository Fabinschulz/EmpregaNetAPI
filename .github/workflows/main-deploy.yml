name: Main - CI/CD EmpregaNet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo.
        type: choice
        options: [Develop, Homolog, Production]
        default: Develop

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar áreas alteradas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-changes.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  ci-backend:
    name: CI - Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    permissions:
      contents: read
    with:
      solution_file: backend/EmpregaNet.sln
      api_project: backend/src/EmpregaNet.Api/EmpregaNet.Api.csproj
      tests_project: backend/tests/tests.csproj
      migrations_project: backend/src/EmpregaNet.Infra/EmpregaNet.Infra.csproj

  ci-frontend:
    name: CI - Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml
    permissions:
      contents: read
    with:
      working_directory: frontend
      api_base_url: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5225' }}

  # Só o backend vira imagem: mudança apenas no frontend não publica nem faz deploy da API.
  image:
    name: CD - Imagem
    needs: [changes, ci-backend]
    if: github.event_name != 'pull_request' && needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/cd-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment || 'Develop' }}
      publish_artifact_name: ${{ needs.ci-backend.outputs.publish_artifact_name }}
      version: ${{ needs.ci-backend.outputs.version }}
      ecr_repository: empreganet-api
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy:
    name: CD - Deploy EC2
    needs: image
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cd-ec2.yml
    permissions:
      contents: read
      id-token: write # OIDC para a AWS
    with:
      environment: ${{ inputs.environment || 'Develop' }}
      aspnetcore_environment: ${{ inputs.environment == 'Production' && 'Production' || 'Staging' }}
      image_uri: ${{ needs.image.outputs.image_uri }}
      image_tag: ${{ needs.image.outputs.image_tag }}
      ecr_registry: ${{ needs.image.outputs.ecr_registry }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
