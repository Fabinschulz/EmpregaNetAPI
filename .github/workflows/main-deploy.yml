name: Main - CI/CD EmpregaNet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo (workspace do Terraform).
        type: choice
        options: [homolog]
        default: homolog
      allow_off_window:
        description: Implantar mesmo com os serviços zerados (fora da janela 07h-00h).
        type: boolean
        default: false

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar áreas alteradas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-changes.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  ci-backend:
    name: CI - Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    permissions:
      contents: read
    with:
      solution_file: backend/EmpregaNet.sln
      api_project: backend/src/EmpregaNet.Api/EmpregaNet.Api.csproj
      tests_project: backend/tests/tests.csproj
      migrations_project: backend/src/EmpregaNet.Infra/EmpregaNet.Infra.csproj

  ci-frontend:
    name: CI - Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml
    permissions:
      contents: read
    with:
      working_directory: frontend
      api_base_url: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5225' }}

  ci-infra:
    name: CI - Infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read

  # Imagens e deploy só rodam fora de pull request e depois que a infraestrutura existe: a variável de repositório
  # AWS_DEPLOY_ROLE_ARN (saída github_actions_role_arn do Terraform) liga os dois; sem ela o CI segue normal.
  # Cada serviço só é publicado e implantado quando a sua área mudou e o seu CI passou.
  image:
    name: CD - Imagens
    needs: [changes, ci-backend, ci-frontend]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
      && (needs.ci-backend.result == 'success' || needs.ci-backend.result == 'skipped')
      && (needs.ci-frontend.result == 'success' || needs.ci-frontend.result == 'skipped')
      && (needs.ci-backend.result == 'success' || needs.ci-frontend.result == 'success') }}
    uses: ./.github/workflows/cd-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment || 'homolog' }}
      api_changed: ${{ needs.ci-backend.result == 'success' }}
      web_changed: ${{ needs.ci-frontend.result == 'success' }}
      publish_artifact_name: ${{ needs.ci-backend.outputs.publish_artifact_name }}

  deploy:
    name: CD - Deploy ECS
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.image.outputs.api_tag != '' || needs.image.outputs.web_tag != '') }}
    uses: ./.github/workflows/cd-ecs.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment || 'homolog' }}
      api_tag: ${{ needs.image.outputs.api_tag }}
      web_tag: ${{ needs.image.outputs.web_tag }}
      allow_off_window: ${{ inputs.allow_off_window || false }}
