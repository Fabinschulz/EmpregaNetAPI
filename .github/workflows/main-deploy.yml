name: Main - CI/CD EmpregaNet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo.
        type: choice
        options: [Develop, Homolog, Production]
        default: Develop

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Escopo das mudanças
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar áreas afetadas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          emit() {
            {
              echo "backend=$1"
              echo "frontend=$2"
            } >> "$GITHUB_OUTPUT"
            echo "backend=$1 frontend=$2"
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Disparo manual: nenhum filtro aplicado."
            emit true true
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" --depth=50 || true
            MERGE_BASE="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
            RANGE="${MERGE_BASE:+$MERGE_BASE..HEAD}"
          else
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="$BEFORE..$GITHUB_SHA"
            else
              RANGE=""
            fi
          fi

          if [ -z "$RANGE" ]; then
            echo "Não foi possível determinar o intervalo de diff; assumindo tudo."
            emit true true
            exit 0
          fi

          echo "Intervalo: $RANGE"
          CHANGED="$(git diff --name-only "$RANGE")"
          echo "::group::Arquivos alterados"
          echo "$CHANGED"
          echo "::endgroup::"

          hit() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          PIPELINE="$(hit '^\.github/(workflows|actions|scripts)/')"
          if [ "$PIPELINE" = "true" ]; then
            emit true true
            exit 0
          fi

          emit "$(hit '^backend/')" "$(hit '^frontend/')"

  ci-backend:
    name: CI - Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    with:
      solution_file: backend/EmpregaNet.sln
      api_project: backend/src/EmpregaNet.Api/EmpregaNet.Api.csproj
      tests_project: backend/tests/tests.csproj
      migrations_project: backend/src/EmpregaNet.Infra/EmpregaNet.Infra.csproj

  ci-frontend:
    name: CI - Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml
    with:
      working_directory: frontend
      api_base_url: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5225' }}

  target:
    name: Resolver alvo
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      aspnetcore_environment: ${{ steps.map.outputs.aspnetcore_environment }}

    steps:
      - name: Mapear ambiente
        id: map
        env:
          CHOSEN: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ENVIRONMENT="${CHOSEN:-Develop}"

          if [ "$ENVIRONMENT" = "Production" ]; then
            ASPNET_ENV=Production
          else
            ASPNET_ENV=Staging
          fi

          {
            echo "environment=$ENVIRONMENT"
            echo "aspnetcore_environment=$ASPNET_ENV"
          } >> "$GITHUB_OUTPUT"

          echo "Alvo: $ENVIRONMENT (ASPNETCORE_ENVIRONMENT=$ASPNET_ENV)"

  image:
    name: CD - Imagem
    needs: [changes, ci-backend, target]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/cd-image.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
      publish_artifact_name: ${{ needs.ci-backend.outputs.publish_artifact_name }}
      version: ${{ needs.ci-backend.outputs.version }}
      ecr_repository: empreganet-api
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy:
    name: CD - Deploy EC2
    needs: [image, target]
    uses: ./.github/workflows/cd-ec2.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
      aspnetcore_environment: ${{ needs.target.outputs.aspnetcore_environment }}
      image_uri: ${{ needs.image.outputs.image_uri }}
      image_tag: ${{ needs.image.outputs.image_tag }}
      ecr_registry: ${{ needs.image.outputs.ecr_registry }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
