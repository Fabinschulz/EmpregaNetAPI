name: Main - CI/CD EmpregaNet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo.
        type: choice
        options: [Develop, Homolog, Production]
        default: Develop

permissions: {}

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-backend:
    name: CI - Backend
    uses: ./.github/workflows/ci-backend.yml
    permissions:
      contents: read
    with:
      solution_file: backend/EmpregaNet.sln
      api_project: backend/src/EmpregaNet.Api/EmpregaNet.Api.csproj
      tests_project: backend/tests/tests.csproj
      migrations_project: backend/src/EmpregaNet.Infra/EmpregaNet.Infra.csproj

  ci-frontend:
    name: CI - Frontend
    uses: ./.github/workflows/ci-frontend.yml
    permissions:
      contents: read
    with:
      working_directory: frontend
      api_base_url: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5225' }}

  target:
    name: Resolver alvo
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      aspnetcore_environment: ${{ steps.map.outputs.aspnetcore_environment }}

    steps:
      - name: Mapear ambiente
        id: map
        env:
          CHOSEN: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ENVIRONMENT="${CHOSEN:-Develop}"

          if [ "$ENVIRONMENT" = "Production" ]; then
            ASPNET_ENV=Production
          else
            ASPNET_ENV=Staging
          fi

          {
            echo "environment=$ENVIRONMENT"
            echo "aspnetcore_environment=$ASPNET_ENV"
          } >> "$GITHUB_OUTPUT"

          echo "Alvo: $ENVIRONMENT (ASPNETCORE_ENVIRONMENT=$ASPNET_ENV)"

  image:
    name: CD - Imagem
    needs: [ci-backend, target]
    uses: ./.github/workflows/cd-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ needs.target.outputs.environment }}
      publish_artifact_name: ${{ needs.ci-backend.outputs.publish_artifact_name }}
      version: ${{ needs.ci-backend.outputs.version }}
      ecr_repository: empreganet-api
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy:
    name: CD - Deploy EC2
    needs: [image, target]
    uses: ./.github/workflows/cd-ec2.yml
    permissions:
      contents: read
      id-token: write # OIDC para a AWS
    with:
      environment: ${{ needs.target.outputs.environment }}
      aspnetcore_environment: ${{ needs.target.outputs.aspnetcore_environment }}
      image_uri: ${{ needs.image.outputs.image_uri }}
      image_tag: ${{ needs.image.outputs.image_tag }}
      ecr_registry: ${{ needs.image.outputs.ecr_registry }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
