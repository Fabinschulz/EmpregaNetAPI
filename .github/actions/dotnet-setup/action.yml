name: Setup .NET com cache de NuGet
description: >
  Instala o SDK, aponta o NUGET_PACKAGES para dentro do workspace e restaura o
  cache de pacotes.

inputs:
  dotnet-version:
    description: Versão do SDK.
    required: false
    default: "10.x"
  cache-prefix:
    required: false
    default: nuget

runs:
  using: composite
  steps:
    - name: Instalar SDK .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Configurar ambiente do CLI
      shell: bash
      run: |
        {
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
          echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1"
          echo "DOTNET_NOLOGO=1"
          echo "NUGET_PACKAGES=${{ github.workspace }}/.nuget/packages"
        } >> "$GITHUB_ENV"

    - name: Restaurar cache de pacotes NuGet
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-
